# Local development only. The credentials are also in .env.example - they are
# not secrets, and both ports are bound to localhost.
services:
  postgres:
    image: postgres:17-alpine
    container_name: research-uploads-db
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research_uploads
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the separate database the tests use - they truncate between
      # cases, so they cannot share the app's database.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U research -d research_uploads']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    # :latest for a take-home run once; production would pin a RELEASE tag so
    # a rebuild months later gets the same binary.
    image: minio/minio:latest
    container_name: research-uploads-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio-dev-user
      MINIO_ROOT_PASSWORD: minio-dev-password
    ports:
      - '127.0.0.1:9000:9000' # S3 API
      - '127.0.0.1:9001:9001' # Web console, not used by the app
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  minio-data:
